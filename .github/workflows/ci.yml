name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Style and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: diary_ci
          POSTGRES_USER: diary_ci
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U diary_ci -d diary_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-only-django-secret-key-not-for-deployment
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver

      DB_NAME: diary_ci
      DB_USER: diary_ci
      DB_PASSWORD: ci_password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"

      CELERY_BROKER_URL: redis://127.0.0.1:6379/0

      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      EMAIL_HOST: localhost
      EMAIL_PORT: "465"
      EMAIL_USE_SSL: "True"
      EMAIL_USE_TLS: "False"
      EMAIL_HOST_USER: ci@example.com
      EMAIL_HOST_PASSWORD: unused

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: python -m pip install poetry==2.2.1

      - name: Install dependencies
        run: poetry install --with dev --no-root --no-interaction

      - name: Check formatting with Black
        run: poetry run black --check .

      - name: Check imports with isort
        run: poetry run isort --check-only .

      - name: Check code with Flake8
        run: poetry run flake8 .

      - name: Check Django configuration
        run: poetry run python manage.py check

      - name: Check for missing migrations
        run: poetry run python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: poetry run python manage.py test --noinput

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: checks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build image
        run: docker build --tag personal-diary:ci .