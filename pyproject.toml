[project]
name = "personal-diary"
version = "0.1.0"
description = ""
authors = [
    {name = "Dima"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django (>=5.2,<5.3)",
    "psycopg[binary] (>=3.3.6,<4.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "celery[redis] (>=5.6.3,<6.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "isort (>=9.0.1,<10.0.0)"
]

[tool.black]
line-length = 88
extend-exclude = '/migrations/'

[tool.isort]
profile = "black"
line_length = 88
skip_glob = ["*/migrations/*"]
extend_skip = [".venv", "venv"]
known_first_party = ["config", "users", "diary"]
